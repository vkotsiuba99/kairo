{{- /* Фонові процеси сервісу без HTTP (опитування лічильників мереж) */}}
{{- $root := . }}
{{- range $name, $w := .Values.workers }}
{{- $spec := merge (dict) $w (index $root.Values.services $w.service) }}
{{- $ctx := dict "root" $root "service" $w.service "spec" $spec }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-{{ $name }}
  labels: {{- include "kairo.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $w.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels: {{- include "kairo.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $root.Values.image.backend }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["python", "{{ $w.script }}"]
          {{- include "kairo.backendEnv" $ctx | nindent 10 }}
          resources: {{- toYaml $w.resources | nindent 12 }}
{{- end }}
