# Створює окрему базу для кожного сервісу на сервері RDS перед встановленням або оновленням
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-init
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: postgres:16-alpine
          env:
            - name: PGHOST
              value: {{ .Values.database.host | quote }}
            - name: PGPORT
              value: {{ .Values.database.port | quote }}
            - name: PGUSER
              value: {{ .Values.database.user | quote }}
            - name: PGPASSWORD
              value: {{ required "database.password is required" .Values.database.password | quote }}
          command:
            - sh
            - -c
            - |
              {{- range $name, $spec := .Values.services }}
              {{- if $spec.database }}
              psql -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '{{ $spec.database }}'" | grep -q 1 \
                || psql -d postgres -c "CREATE DATABASE {{ $spec.database }}"
              {{- end }}
              {{- end }}
