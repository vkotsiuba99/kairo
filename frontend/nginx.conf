server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Вбудований DNS Docker. Без нього nginx резолвить адресу контейнера api
    # один раз під час старту й тримає її вічно: після будь-якого перезапуску
    # api адреса змінюється, і шлюз назавжди повертає 502, хоча бекенд живий.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Frontend Single Page App routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API requests to backend
    location /api/ {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        # Офлайн-симуляція політик рахується довше за типовий веб-запит,
        # тому стандартних 60 секунд шлюзу не вистачає.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Proxy WebSocket requests
    location /ws/ {
        set $ws_upstream api:8000;
        proxy_pass http://$ws_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    # Proxy generated media files
    location /media/ {
        set $media_upstream api:8000;
        proxy_pass http://$media_upstream$request_uri;
        proxy_set_header Host $host;
    }
}
